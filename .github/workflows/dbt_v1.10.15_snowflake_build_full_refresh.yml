name: Snowflake CICD Full Refresh
on:
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from UI

permissions:
  contents: read

concurrency:
  # Ensure only one instance of this workflow runs across all PRs to prevent database conflicts
  group: ci-testing
  # Don't cancel in-progress runs automatically
  cancel-in-progress: false

jobs:
  dbt_run:
    name: dbt full refresh and test on Snowflake
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Environment variables
      DBT_PROJECT_DIR: "." 
      PYTHON_VERSION: "3.10"
      # Keep these aligned with pyproject.toml.
      DBT_CORE_VERSION: "1.10.20"
      DBT_SNOWFLAKE_VERSION: "1.10.7"
      DBT_PROFILES_DIR: ./integration_tests/profiles/snowflake

      # Connection variables
      DBT_SNOWFLAKE_CI_ACCOUNT: ${{ secrets.DBT_SNOWFLAKE_CI_ACCOUNT }}
      DBT_SNOWFLAKE_CI_WAREHOUSE: ${{ secrets.DBT_SNOWFLAKE_CI_WAREHOUSE }}
      DBT_SNOWFLAKE_CI_DATABASE: ${{ secrets.DBT_SNOWFLAKE_CI_DATABASE }}  
      DBT_SNOWFLAKE_CI_ROLE: ${{ secrets.DBT_SNOWFLAKE_CI_ROLE }}
      DBT_SNOWFLAKE_CI_SCHEMA: ${{ secrets.DBT_SNOWFLAKE_CI_SCHEMA }}
      DBT_SNOWFLAKE_CI_USER: ${{ secrets.DBT_SNOWFLAKE_CI_USER }}
      # DBT_ENV_SECRET_* values are redacted by dbt as well as GitHub Actions.
      DBT_ENV_SECRET_SNOWFLAKE_PRIVATE_KEY: ${{ secrets.DBT_SNOWFLAKE_CI_PRIVATE_KEY }}
      DBT_ENV_SECRET_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.DBT_SNOWFLAKE_CI_PRIVATE_KEY_PASSPHRASE }}

    steps:
      - name: Check required Snowflake settings
        shell: bash
        run: |
          missing=0
          for name in DBT_SNOWFLAKE_CI_ACCOUNT DBT_SNOWFLAKE_CI_WAREHOUSE \
            DBT_SNOWFLAKE_CI_DATABASE DBT_SNOWFLAKE_CI_ROLE \
            DBT_SNOWFLAKE_CI_SCHEMA DBT_SNOWFLAKE_CI_USER \
            DBT_ENV_SECRET_SNOWFLAKE_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required Snowflake CI setting: $name. See integration_tests/README.md."
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-core==$DBT_CORE_VERSION" "dbt-snowflake==$DBT_SNOWFLAKE_VERSION"

      - name: Install dbt dependencies
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt deps

      - name: Test Connection
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt debug

      - name: Run build models
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt build --full-refresh
