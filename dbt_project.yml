name: 'medicare_cclf_connector'
version: '1.0.0'
config-version: 2

profile: default

flags:
  # Tuva Core 1.0 resolves refs inside a package before the root project.
  require_ref_searches_node_package_before_root: true

vars:
  ## Set the database and schema where raw CCLF data is stored
  input_database: tuva
  input_schema: raw

  claims_enabled: true

  ## Uncomment this variable if enrollment source is member months
  #  member_months_enrollment: true

model-paths: ["models"]
docs-paths: ["descriptions"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
   medicare_cclf_connector:
     final:
       +materialized: table
     intermediate:
       +materialized: table
     staging:
       +materialized: view
