  # The same rule on the CCLF-only branch (the default parse). The fixture
  # seeds cannot hold an empty or all-space code, since a blank CSV cell
  # loads as null, so those cases are covered here.
  - name: eligibility_cclf_dual_status_picks_delivery_on_raw_code
    description: >
      Without cms_alr_connector, each enrollment row takes dual_status_code
      from the latest CCLF8 delivery on or before its last month whose raw
      code is not blank, else the earliest later one; 'NA' then maps to
      null. Blank codes never reach the output as ''.
    model: eligibility
    overrides:
      vars:
        cms_alr_connector: false
    given:
      - input: ref('int_enrollment')
        format: sql
        rows: |
          select 'C-FULL-NA' as current_bene_mbi_id, cast('2025-01-01' as date) as enrollment_start_date, cast('2025-03-31' as date) as enrollment_end_date
          union all select 'C-NA-FULL' as current_bene_mbi_id, cast('2025-01-01' as date) as enrollment_start_date, cast('2025-03-31' as date) as enrollment_end_date
          union all select 'C-BLANK' as current_bene_mbi_id, cast('2025-01-01' as date) as enrollment_start_date, cast('2025-03-31' as date) as enrollment_end_date
          union all select 'C-SPACES' as current_bene_mbi_id, cast('2025-01-01' as date) as enrollment_start_date, cast('2025-03-31' as date) as enrollment_end_date
          union all select 'C-LATER' as current_bene_mbi_id, cast('2025-01-01' as date) as enrollment_start_date, cast('2025-03-31' as date) as enrollment_end_date
          union all select 'C-BLANK-ONLY' as current_bene_mbi_id, cast('2025-01-01' as date) as enrollment_start_date, cast('2025-03-31' as date) as enrollment_end_date
          union all select 'C-NONE' as current_bene_mbi_id, cast('2025-01-01' as date) as enrollment_start_date, cast('2025-03-31' as date) as enrollment_end_date
      - input: ref('int_beneficiary_demographics_deduped')
        format: sql
        rows: |
          select
                m.current_bene_mbi_id
              , cast(null as varchar) as bene_hic_num
              , cast(null as varchar) as bene_fips_state_cd
              , cast(null as varchar) as bene_fips_cnty_cd
              , cast(null as varchar) as bene_zip_cd
              , cast(null as date) as bene_dob
              , cast(null as varchar) as bene_sex_cd
              , cast(null as varchar) as bene_race_cd
              , cast(null as varchar) as bene_mdcr_stus_cd
              , m.bene_dual_stus_cd
              , cast(null as date) as bene_death_dt
              , cast(null as date) as bene_rng_bgn_dt
              , cast(null as date) as bene_rng_end_dt
              , cast(null as varchar) as bene_1st_name
              , cast(null as varchar) as bene_midl_name
              , cast(null as varchar) as bene_last_name
              , cast(null as varchar) as bene_orgnl_entlmt_rsn_cd
              , cast(null as varchar) as bene_entlmt_buyin_ind
              , cast(null as date) as bene_part_a_enrlmt_bgn_dt
              , cast(null as date) as bene_part_b_enrlmt_bgn_dt
              , cast(null as varchar) as bene_line_1_adr
              , cast(null as varchar) as bene_line_2_adr
              , cast(null as varchar) as bene_line_3_adr
              , cast(null as varchar) as bene_line_4_adr
              , cast(null as varchar) as bene_line_5_adr
              , cast(null as varchar) as bene_line_6_adr
              , cast(null as varchar) as geo_zip_plc_name
              , cast(null as varchar) as geo_usps_state_cd
              , cast(null as varchar) as geo_zip5_cd
              , cast(null as varchar) as geo_zip4_cd
              , m.coverage_month
              , m.file_name
              , m.file_date
          from (values
                ('C-FULL-NA', cast('2025-01-01' as date), '02', 'cclf8_2025-01.txt', cast('2025-01-10' as date))
              , ('C-FULL-NA', cast('2025-03-01' as date), 'NA', 'cclf8_2025-03.txt', cast('2025-03-10' as date))
              , ('C-NA-FULL', cast('2025-01-01' as date), 'NA', 'cclf8_2025-01.txt', cast('2025-01-10' as date))
              , ('C-NA-FULL', cast('2025-03-01' as date), '02', 'cclf8_2025-03.txt', cast('2025-03-10' as date))
              , ('C-BLANK', cast('2025-01-01' as date), '02', 'cclf8_2025-01.txt', cast('2025-01-10' as date))
              , ('C-BLANK', cast('2025-03-01' as date), '', 'cclf8_2025-03.txt', cast('2025-03-10' as date))
              , ('C-SPACES', cast('2025-01-01' as date), '02', 'cclf8_2025-01.txt', cast('2025-01-10' as date))
              , ('C-SPACES', cast('2025-03-01' as date), '   ', 'cclf8_2025-03.txt', cast('2025-03-10' as date))
