              , cast(null as varchar) as geo_zip_plc_name
              , cast(null as varchar) as geo_usps_state_cd
              , cast(null as varchar) as geo_zip5_cd
              , cast(null as varchar) as geo_zip4_cd
              , cast(null as varchar) as demographics_file_name
              , cast(null as date) as demographics_file_date
          from (values
                ('MBI-GAP', cast('2024-11-01' as date), 0, 1, cast(null as varchar), '02')
