packages:
  - package: dbt-labs/dbt_utils
    version: [">=0.9.2"]
  # Installed from GitHub rather than the dbt hub: the hub's index for the_tuva_project
  # carries a require-dbt-version string (">=1.10.5,<3.0.0") that dbt 1.10's semver parser
  # rejects, which breaks `dbt deps` for every version pin. Bump `revision` to upgrade.
  - git: https://github.com/tuva-health/the_tuva_project.git
    revision: v0.17.2
